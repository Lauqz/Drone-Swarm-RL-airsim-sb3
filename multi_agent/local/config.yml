# Modes: 1) depth, 2) single_rgb, 3) multi_rgb
train_mode: "single_rgb"
test_mode: "single_rgb"

# Number drones
num_drones: 3

# ---- local-sim specific ----
# Independent arenas stepped in parallel (AirSim was limited to 1 simulator).
num_vec_envs: 1

# Live browser view at http://localhost:<viewer_port> (works from Windows).
# Headless when false; off by default for training, on by default in evaluate.py.
viewer: false
viewer_port: 8777

# Camera supersampling: NxN rays per pixel (resolution stays 84x84).
# 2 = smooth, detailed frames (default). 1 = ~3x faster rendering, blockier.
samples: 2

# Print the per-step debug dump like the AirSim env did.
verbose: false

# ---- shared with the AirSim variant ----
# Observation: add the previously executed velocity command as "prev_act".
# Off by default so the observation space matches the old runs/saved policies.
prev_action_obs: false

# PPO exploration: initial log standard deviation of the Gaussian policy
# (SB3 default is 0.0 -> std 1 m/s on each velocity axis, which makes an
# untrained swarm zig-zag). -1.0 -> std ~0.37 m/s. Only applies to a new model.
log_std_init: -1.0
